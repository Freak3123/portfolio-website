<svg xmlns="http://www.w3.org/2000/svg" width="300" height="760" viewBox="0 0 300 760">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF2A8"/>
      <stop offset=".2" stop-color="#D68B18"/>
      <stop offset=".48" stop-color="#FFD85C"/>
      <stop offset=".72" stop-color="#A95C0C"/>
      <stop offset="1" stop-color="#FFE58A"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8068"/>
      <stop offset=".45" stop-color="#F04D38"/>
      <stop offset="1" stop-color="#C83B2E"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF08A"/>
      <stop offset=".5" stop-color="#FFC928"/>
      <stop offset="1" stop-color="#E89A08"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78D9D1"/>
      <stop offset=".5" stop-color="#39AEB0"/>
      <stop offset="1" stop-color="#147E88"/>
    </linearGradient>
    <linearGradient id="whiteShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <clipPath id="topGemClip">
      <rect x="91" y="63" width="118" height="154" rx="6"/>
    </clipPath>
    <clipPath id="dropClip">
      <rect x="91" y="345" width="118" height="285" rx="7"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <!-- Top coral gemstone with gold bezel -->
    <rect x="78" y="50" width="144" height="180" rx="13" fill="url(#gold)"/>
    <rect x="91" y="63" width="118" height="154" rx="6" fill="url(#coral)"/>

    <!-- Faceted coral highlights -->
    <g clip-path="url(#topGemClip)">
      <path d="M91 63 L209 63 L188 82 L112 82 Z" fill="#FFB0A0" opacity=".7"/>
      <path d="M91 63 L112 82 L112 202 L91 217 Z" fill="#C63A2E" opacity=".55"/>
      <path d="M209 63 L188 82 L188 202 L209 217 Z" fill="#FF9B88" opacity=".45"/>
      <path d="M112 82 L188 82 L188 202 L112 202 Z" fill="#F05540"/>
      <path d="M112 82 L137 96 L137 188 L112 202 Z" fill="#FF765D" opacity=".6"/>
      <path d="M188 82 L166 96 L166 188 L188 202 Z" fill="#D43D31" opacity=".5"/>
      <path d="M146 73 L154 73 L154 202 L146 202 Z" fill="url(#whiteShine)" opacity=".55"/>
    </g>

    <!-- Connector -->
    <path d="M139 220 L161 220 L161 270 L150 281 L139 270 Z" fill="url(#gold)"/>

    <!-- Gold ring -->
    <circle cx="150" cy="278" r="27" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <circle cx="150" cy="278" r="16" fill="#FFF0A0" opacity=".2"/>

    <!-- Small gold stem -->
    <rect x="140" y="299" width="20" height="47" rx="4" fill="url(#gold)"/>

    <!-- Main multicolor pendant frame -->
    <rect x="78" y="334" width="144" height="306" rx="13" fill="url(#gold)"/>

    <!-- Multicolor enamel interior -->
    <g clip-path="url(#dropClip)">
      <rect x="91" y="345" width="118" height="285" fill="url(#yellow)"/>

      <!-- Coral diagonal section -->
      <path d="M91 505 L209 385 L209 500 L91 620 Z" fill="url(#coral)"/>

      <!-- Teal lower section -->
      <path d="M91 566 L209 447 L209 630 L91 630 Z" fill="url(#teal)"/>

      <!-- Correct diagonal transitions -->
      <path d="M91 345 L209 345 L209 390 L91 510 Z" fill="url(#yellow)"/>
      <path d="M91 510 L209 390 L209 500 L91 620 Z" fill="url(#coral)"/>
      <path d="M91 620 L209 500 L209 630 L91 630 Z" fill="url(#teal)"/>

      <!-- Faceted reflections -->
      <path d="M91 345 L116 365 L116 492 L91 510 Z" fill="#FFEFA0" opacity=".55"/>
      <path d="M209 390 L184 414 L184 489 L209 500 Z" fill="#FFB09C" opacity=".5"/>
      <path d="M91 510 L116 486 L116 595 L91 620 Z" fill="#FF806C" opacity=".4"/>
      <path d="M184 524 L209 500 L209 630 L184 630 Z" fill="#8BE0D9" opacity=".45"/>
      <path d="M148 345 L158 345 L158 625 L148 630 Z" fill="url(#whiteShine)" opacity=".35"/>
    </g>

    <!-- Inner gold border -->
    <rect x="91" y="345" width="118" height="285" rx="7"
          fill="none" stroke="#FFF0A0" stroke-opacity=".65" stroke-width="3"/>
  </g>
</svg>